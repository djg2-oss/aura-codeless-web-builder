<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codeless Web Builder</title><style>
:root{--bg:#0c0e12;--panel:#141820;--line:#2a3140;--ink:#e8e4da;--muted:#9a9386;--gold:#c6a15b;--teal:#6fbfb0;--danger:#c46b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
a{color:var(--gold);text-decoration:none}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;letter-spacing:.04em}h2{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}
.wrap{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}
nav button,button,.chip{background:#1c2230;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
nav{padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
main{padding:18px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 6px;font-size:15px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
input,select,textarea{background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
pre,textarea.log{font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap}
.player{background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
video{width:100%;max-height:360px;background:#000;display:block}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-size:13px}
</style></head><body>
<header><div><div class="tag">G2P Technologies</div><h1>Codeless Web Builder</h1><div class="muted">Block page, name the business, export static HTML</div></div>
<div class="row"><a href="../index.html">Command</a><a href="../office/index.html">Office</a><a href="../sm/index.html">Small–Medium</a><a href="../ml/index.html">Medium–Large</a><a href="../builder/index.html">Builder</a></div>
</header>
<div class="wrap"><nav><button>Canvas</button></nav><main>
<section><div class="grid">
<div class="card"><h3>Blocks</h3>
<div class="row"><button data-b="hero">Hero</button><button data-b="offer">Offer</button><button data-b="proof">Proof</button><button data-b="contact">Contact</button><button data-b="player">Player</button></div>
<label>Business<input id="biz" value="AuraG2P Studio"></label>
</div>
<div class="card"><h3>Canvas</h3><div id="canvas"></div><div class="row"><button id="up">Export HTML</button><button id="clear">Clear</button></div></div>
</div>
<div class="card"><h3>Player block</h3><div class="player"><video id="pv" controls playsinline></video></div><input type="file" id="pf" accept="video/*,audio/*"></div>
</section>
</main></div>
<script>
const $=s=>document.querySelector(s); const blocks=[];
function paint(){ $('#canvas').innerHTML=blocks.map((b,i)=>`<div class="card"><b>${b}</b> — ${$('#biz').value}<div><button data-x="${i}">remove</button></div></div>`).join('')||'<p class="muted">Add blocks. Order is the page.</p>';
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{blocks.splice(+b.dataset.x,1);paint();}); }
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{blocks.push(b.dataset.b);paint();});
$('#clear').onclick=()=>{blocks.length=0;paint();};
$('#up').onclick=()=>{ const name=$('#biz').value; const html='<!doctype html><meta charset=utf-8><title>'+name+'</title><h1>'+name+'</h1>'+blocks.map(b=>'<section><h2>'+b+'</h2></section>').join('');
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='site.html'; a.click(); };
$('#pf').onchange=e=>{const f=e.target.files[0]; if(f) $('#pv').src=URL.createObjectURL(f);};
paint();
</script></body></html>
