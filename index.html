<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aura G2P codeless builder</title>
<style>

:root { --bg:#0c0f14; --panel:#141a22; --line:#2a3442; --ink:#e8eef6; --muted:#93a0b3; --gold:#d7b56d; --teal:#6ec8c4; --danger:#e07a7a; --ok:#7dcea0; }
* { box-sizing:border-box; }
body { margin:0; font-family: "Segoe UI", Inter, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--gold); }

:root { --gold:#c9a27c; }
header.top { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; padding:22px 28px; border-bottom:1px solid var(--line); background:#10151c; }
header.top h1 { margin:0; font-size:22px; letter-spacing:.04em; }
header.top p { margin:6px 0 0; color:var(--muted); max-width:760px; }
.badge { border:1px solid var(--gold); color:var(--gold); padding:4px 10px; border-radius:999px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
main { display:grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 92px); }
nav { border-right:1px solid var(--line); padding:14px; background:#0e131a; }
nav button { display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--ink); padding:10px 12px; border-radius:8px; margin-bottom:6px; }
nav button.active, nav button:hover { border-color:var(--line); background:#1b2430; }
section.view { display:none; padding:22px 26px 40px; }
section.view.active { display:block; }
.grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
.card h3 { margin:0 0 6px; font-size:16px; }
.card p, .muted { color:var(--muted); font-size:13px; line-height:1.45; }
.row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
input, select, textarea { background:#0d1218; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.btn { background:var(--gold); color:#1a1408; border:0; border-radius:8px; padding:8px 12px; font-weight:600; }
.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
.tree, .log, pre.out { background:#0b1016; border:1px solid var(--line); border-radius:10px; padding:12px; font-family: ui-monospace, Consolas, monospace; font-size:12.5px; white-space:pre-wrap; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { border-bottom:1px solid var(--line); text-align:left; padding:8px; }
.kpi { font-size:22px; color:var(--gold); }
video, audio { width:100%; margin-top:8px; background:#000; border-radius:8px; }
@media (max-width:860px) { main { grid-template-columns:1fr; } nav { display:flex; gap:6px; overflow:auto; } nav button { width:auto; white-space:nowrap; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Aura G2P codeless builder</h1>
    <p>Template-driven factory. Pick a tier, stack blocks, export one HTML file.</p>
  </div>
  <div class="badge">G2P · djg2-oss</div>
</header>
<main>

<nav>
  <button class="active" data-id="build">Build</button>
  <button data-id="library">Library</button>
  <button data-id="export">Export</button>
</nav>
<div>
<section class="view active" id="build">
  <h2>Codeless builder</h2>
  <div class="row">
    <input id="siteName" placeholder="site name" value="Client site"/>
    <select id="tier"><option value="smb">Small to medium</option><option value="mid">Medium to large</option><option value="complex">Complex office / studio</option></select>
    <select id="tpl"></select>
    <button class="btn" id="addBlock">Add block</button>
  </div>
  <div id="canvas" class="card"></div>
</section>
<section class="view" id="library"><h2>Block library</h2><div class="grid" id="lib"></div></section>
<section class="view" id="export"><h2>Export</h2><p class="muted">Downloads a single HTML file. No account required.</p><button class="btn" id="dl">Download site</button><pre class="out" id="code"></pre></section>
</div>

</main>
<script>

const LIB = {
 smb: ["Hero","Offer","Proof","Booking","Hours","Map note"],
 mid: ["Hero","Locations","Pricing","Security","Team","RFQ"],
 complex: ["Desk status","File pack","Session board","Deploy pack","Decision log","Player"]
};
const tier=document.getElementById("tier");
const tpl=document.getElementById("tpl");
const canvas=document.getElementById("canvas");
let blocks=[];
function fill(){
  tpl.innerHTML="";
  LIB[tier.value].forEach(n=>{ const o=document.createElement("option"); o.textContent=n; tpl.appendChild(o); });
}
tier.onchange=fill; fill();
function draw(){
  canvas.innerHTML = blocks.map((b,i)=>`<div class="card"><strong>${b}</strong><div class="muted">Block ${i+1} · drag-free stack</div><button class="btn ghost" data-i="${i}">Remove</button></div>`).join("") || "<p class='muted'>Empty canvas. Add a block.</p>";
  canvas.querySelectorAll("button").forEach(b=>b.onclick=()=>{ blocks.splice(+b.dataset.i,1); draw(); });
}
document.getElementById("addBlock").onclick=()=>{ blocks.push(tpl.value); draw(); };
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("active", s.id===b.dataset.id));
  if(b.dataset.id==="export") document.getElementById("code").textContent=html();
});
const lib=document.getElementById("lib");
Object.entries(LIB).forEach(([k,arr])=>{ const c=document.createElement("div"); c.className="card"; c.innerHTML=`<h3>${k}</h3><p>${arr.join(", ")}</p>`; lib.appendChild(c); });
function html(){
  const name=document.getElementById("siteName").value||"Site";
  const inner=blocks.map(b=>`<section><h2>${b}</h2><p>${name} · ${tier.value}</p></section>`).join("");
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${name}</title></head><body>${inner}</body></html>`;
}
document.getElementById("dl").onclick=()=>{
  const blob=new Blob([html()],{type:"text/html"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(document.getElementById("siteName").value||"site").replace(/\s+/g,"-")+".html"; a.click();
};
draw();

</script>
</body>
</html>
