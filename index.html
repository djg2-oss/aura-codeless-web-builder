<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aura Codeless Builder</title>
<style>
:root { --bg:#0c0f14; --panel:#151b24; --line:#2a3444; --text:#e8edf5; --muted:#93a0b5; --accent:#d7b36a; --ok:#7dcea0; }
* { box-sizing:border-box; }
body { margin:0; font-family:Georgia, "Iowan Old Style", serif; background:radial-gradient(1200px 500px at 10% -10%, #1c2838, var(--bg)); color:var(--text); }
header { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; padding:28px 32px 12px; border-bottom:1px solid var(--line); }
h1 { font-weight:500; letter-spacing:.04em; margin:0; font-size:28px; }
.kicker { color:var(--accent); letter-spacing:.18em; text-transform:uppercase; font-size:11px; font-family:ui-sans-serif, system-ui; }
nav button, .btn { background:#1c2533; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer; font-family:ui-sans-serif, system-ui; }
nav button.on, .btn.primary { background:var(--accent); color:#1a1408; border-color:var(--accent); }
main { padding:22px 32px 64px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
.card h3 { margin:0 0 8px; font-size:18px; }
.muted { color:var(--muted); font-family:ui-sans-serif, system-ui; font-size:13px; line-height:1.45; }
input, select, textarea { width:100%; background:#0e141c; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-family:ui-sans-serif, system-ui; }
textarea { min-height:90px; }
label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; font-family:ui-sans-serif, system-ui; }
pre, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; white-space:pre-wrap; }
.player { background:#090d13; border:1px solid var(--line); border-radius:16px; padding:12px; }
video, audio { width:100%; }
.tag { display:inline-block; margin:4px 4px 0 0; padding:4px 8px; border-radius:999px; border:1px solid var(--line); font-size:12px; font-family:ui-sans-serif, system-ui; }
section { display:none; }
section.on { display:block; }
table { width:100%; border-collapse:collapse; font-family:ui-sans-serif, system-ui; font-size:13px; }
td, th { border-bottom:1px solid var(--line); text-align:left; padding:8px; }
</style>
</head>
<body>
<header>
  <div><div class="kicker">Template pages without a framework</div><h1>Aura Codeless Builder</h1></div>
  <nav id="nav"></nav>
</header>
<main>
<section data-tab="Canvas">
  <div class="grid">
    <article class="card">
      <h3>Blocks</h3>
      <label>Headline</label><input id="h" value="Book the room"/>
      <label>Sub</label><input id="s" value="Aura G2P keeps the session, the files, and the release in one place."/>
      <label>Color</label><input id="c" value="#102033"/>
      <p><button class="btn primary" onclick="render()">Render and download</button></p>
    </article>
    <article class="card"><iframe id="pv" style="width:100%;height:320px;border:0;background:#fff;border-radius:12px"></iframe></article>
  </div>
</section>
<section data-tab="Method">
  <article class="card"><h3>Best build path</h3><p class="muted">Static HTML first. Host on the existing GitHub pages or Hostinger desk. Add a backend only when payments or logins are real. Templates stay data, not plugins, so the page stays fast.</p></article>
</section>
<script>
function render() {
  const html = '<!doctype html><meta charset=utf-8><title>'+h.value+'</title><body style="margin:0;font-family:Georgia;background:'+c.value+';color:#f4f1ea"><main style="max-width:720px;margin:auto;padding:64px 24px"><p style="letter-spacing:.2em;text-transform:uppercase;font-size:12px">Aura G2P</p><h1>'+h.value+'</h1><p>'+s.value+'</p><a href="#book" style="color:#e7c98a">Request a session</a></main></body>';
  pv.srcdoc = html;
  dl('page.html', html, 'text/html');
}
render();
</script>
</main>
<script>
const nav = document.getElementById('nav');
const sections = [...document.querySelectorAll('main section')];
sections.forEach((s,i) => {
  const b = document.createElement('button');
  b.textContent = s.dataset.tab;
  if(i===0) { b.classList.add('on'); s.classList.add('on'); }
  b.onclick = () => {
    sections.forEach(x => x.classList.remove('on'));
    [...nav.children].forEach(x => x.classList.remove('on'));
    s.classList.add('on'); b.classList.add('on');
  };
  nav.appendChild(b);
});
function dl(name, text, type='text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
}
</script>
</body>
</html>
